<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e2530"/>
      <stop offset="100%" stop-color="#080c14"/>
    </linearGradient>
    <linearGradient id="sh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a8a40"/>
      <stop offset="100%" stop-color="#1e5224"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="200" fill="url(#bg)"/>

  <!-- Shield gold border -->
  <path d="M512,85 L875,195 L875,515 Q875,765 512,935 Q149,765 149,515 L149,195 Z"
        fill="#b8860b"/>

  <!-- Shield green body -->
  <path d="M512,118 L848,220 L848,515 Q848,742 512,902 Q176,742 176,515 L176,220 Z"
        fill="url(#sh)"/>

  <!-- Horizontal divider bar -->
  <rect x="205" y="408" width="614" height="12" fill="#b8860b" opacity="0.7" rx="6"/>

  <!-- Diamond ornament above text -->
  <polygon points="512,310 544,362 512,414 480,362" fill="#f0c040" opacity="0.9"/>

  <!-- IW monogram -->
  <text x="512" y="665"
        font-family="Georgia,'Times New Roman',serif"
        font-size="230" font-weight="bold"
        text-anchor="middle" dominant-baseline="middle"
        fill="white" opacity="0.95">IW</text>
</svg>
