name: Build iOS

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Sync web assets into iOS project
        run: npx cap sync ios

      - name: Build iOS (simulator — no signing needed)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath ios/build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO \
            build

      - name: Upload iOS simulator build
        uses: actions/upload-artifact@v4
        with:
          name: idlewright-ios-sim-${{ github.run_number }}
          path: ios/build/Build/Products/Debug-iphonesimulator/
          retention-days: 30
